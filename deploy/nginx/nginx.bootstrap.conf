server_tokens off;
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 30s;
client_max_body_size 10m;

server {
    listen 80;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 503;
    }
}
