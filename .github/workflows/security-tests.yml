name: Security Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/security-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      APP_ENV: test
      DATABASE_URL: sqlite://
      JWT_ACTIVE_KID: test-v1
      REDIS_URL: ""
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Configure ephemeral JWT test key
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("JWT_SIGNING_KEYS=" + json.dumps({"test-v1": secrets.token_urlsafe(48)}) + "\n")
          PY
      - name: Run security regression suite
        working-directory: backend
        run: pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build
