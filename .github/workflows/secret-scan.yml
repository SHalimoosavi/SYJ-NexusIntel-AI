name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - feat/security-hardening
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks repository and change scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan pull-request or push changes
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_REDACT: "true"
      - name: Scan all commits reachable from repository refs
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.3
          detect --source=/repo --redact --verbose --exit-code=2 --log-opts=--all
