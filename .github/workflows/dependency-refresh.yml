name: Dependency Refresh

on:
  push:
    branches:
      - feat/security-hardening
    paths:
      - frontend/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-npm-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/security-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh lockfile without force upgrades or install scripts
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --ignore-scripts --no-fund --no-progress || true
      - name: Commit lockfile updates to the approved branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- frontend/package-lock.json; then
            git add frontend/package-lock.json
            git commit -m "build(deps): refresh npm lockfile for security fixes"
            git push origin HEAD:feat/security-hardening
          else
            echo "No lockfile changes required"
          fi
      - name: Report remaining high and critical advisories
        working-directory: frontend
        run: npm audit --audit-level=high
