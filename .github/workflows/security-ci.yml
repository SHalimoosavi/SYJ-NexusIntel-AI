name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/security-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite://
          REDIS_URL: ""
          JWT_ACTIVE_KID: test-v1
          JWT_SIGNING_KEYS: '{"test-v1":"TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"}'
          CORS_ORIGINS: http://localhost:3000
        run: pytest -q

  frontend-security:
    name: Frontend audit, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build
